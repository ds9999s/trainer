<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammatik Trainer — B1 / B2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
    }
    .glass-card-hover:hover {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(255, 255, 255, 1);
      box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.12);
      transform: translateY(-2px);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body class="bg-[#f1f5f9] text-slate-900 min-h-screen relative overflow-x-hidden flex flex-col items-center py-10 px-4 sm:px-6">

  <!-- Декоративні фонові сфери -->
  <div class="fixed top-[-10%] left-[-5%] w-[450px] h-[450px] rounded-full bg-gradient-to-tr from-indigo-300/40 to-blue-200/40 blur-[100px] pointer-events-none -z-10"></div>
  <div class="fixed top-[40%] right-[-5%] w-[500px] h-[500px] rounded-full bg-gradient-to-bl from-purple-300/35 to-pink-200/35 blur-[120px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-[-10%] left-[20%] w-[550px] h-[550px] rounded-full bg-gradient-to-tr from-sky-200/40 to-teal-200/30 blur-[110px] pointer-events-none -z-10"></div>

  <!-- ГОЛОВНИЙ ЕКРАН ТЕМ -->
  <main id="main-view" class="max-w-5xl w-full">
    <header class="text-center mb-10">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 glass-card rounded-full text-indigo-700 text-xs font-semibold uppercase tracking-wider mb-3.5 shadow-sm">
        ✨ Deutsch B1 · B2
      </div>
      <h1 class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight mb-2.5">
        Grammatik <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-blue-600">Trainer</span>
      </h1>
      <p class="text-slate-500 font-medium text-sm sm:text-base">Короткі правила та інтерактивні тести</p>
      
      <!-- Пошуковий рядок -->
      <div class="mt-7 max-w-md mx-auto relative">
        <input type="text" id="search-input" placeholder="Швидкий пошук теми або правила..." 
          class="w-full glass-input rounded-2xl px-5 py-3.5 pl-12 text-sm shadow-sm outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all placeholder:text-slate-400 text-slate-800">
        <svg class="w-5 h-5 text-slate-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </header>

    <!-- Сітка карток -->
    <div id="topics-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5"></div>
  </main>

  <!-- ЕКРАН ТЕСТУВАННЯ -->
  <section id="quiz-view" class="max-w-xl w-full hidden">
    <div class="flex items-center justify-between mb-4">
      <button id="back-btn" class="text-slate-500 hover:text-slate-900 font-medium text-sm inline-flex items-center gap-1.5 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Всі теми
      </button>

      <button id="open-theory-btn" class="text-xs font-semibold text-indigo-700 bg-indigo-50/80 hover:bg-indigo-100 border border-indigo-200/60 px-3.5 py-1.5 rounded-full inline-flex items-center gap-1.5 transition shadow-xs">
        💡 Правило
      </button>
    </div>

    <div class="glass-card p-6 sm:p-9 rounded-[32px] relative">
      <div class="flex justify-between items-center mb-4">
        <span id="quiz-title" class="text-[11px] font-bold text-indigo-700 bg-indigo-50/80 px-3 py-1 rounded-full uppercase tracking-wider"></span>
        <span id="quiz-progress" class="text-xs text-slate-400 font-mono font-medium">1 / 1</span>
      </div>

      <div class="w-full bg-slate-200/60 h-1.5 rounded-full mb-6 overflow-hidden">
        <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-blue-500 h-full transition-all duration-300 rounded-full" style="width: 0%"></div>
      </div>

      <!-- Рядок швидкого вибору номерів питань -->
      <div id="question-nav" class="flex flex-wrap gap-1.5 mb-6"></div>

      <!-- Блок питання -->
      <div class="mb-6">
        <span id="task-instruction" class="text-xs font-semibold text-indigo-600 block mb-1"></span>
        <p id="quiz-question" class="text-lg sm:text-xl font-semibold leading-relaxed text-slate-800"></p>
      </div>

      <div id="options-container" class="space-y-3.5 mb-6"></div>

      <!-- Пояснення -->
      <div id="quiz-feedback" class="p-5 rounded-2xl mb-6 hidden text-sm font-medium leading-relaxed backdrop-blur-md"></div>

      <div class="flex gap-3">
        <button id="check-btn" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold py-4 px-4 rounded-2xl transition shadow-lg shadow-indigo-500/25 active:scale-[0.99]">
          Перевірити відповідь
        </button>
        <button id="next-btn" class="w-full bg-slate-900 hover:bg-black text-white font-semibold py-4 px-4 rounded-2xl transition shadow-lg shadow-slate-900/20 hidden active:scale-[0.99]">
          Наступне завдання →
        </button>
      </div>
    </div>
  </section>

  <!-- МОДАЛЬНЕ ВІКНО З ТЕОРІЄЮ -->
  <div id="theory-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card bg-white/95 max-w-lg w-full p-6 sm:p-8 rounded-[32px] shadow-2xl relative max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-start mb-4">
        <div>
          <span class="text-[11px] font-bold tracking-wider text-indigo-600 uppercase block">Коротке правило</span>
          <h3 id="modal-theory-title" class="text-xl font-bold text-slate-900"></h3>
        </div>
        <button id="close-theory-btn" class="text-slate-400 hover:text-slate-700 p-1 rounded-full transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div id="modal-theory-content" class="text-sm text-slate-600 leading-relaxed space-y-3"></div>

      <button id="modal-start-btn" class="mt-6 w-full bg-slate-900 hover:bg-black text-white font-semibold py-3 rounded-xl transition text-sm">
        Зрозуміло, до вправ
      </button>
    </div>
  </div>

  <!-- ЕКРАН РЕЗУЛЬТАТІВ -->
  <section id="result-view" class="max-w-md w-full text-center hidden">
    <div class="glass-card p-8 sm:p-10 rounded-[36px]">
      <div class="text-5xl mb-4">🎯</div>
      <h2 class="text-2xl font-extrabold text-slate-900 mb-1">Розділ завершено!</h2>
      <p id="result-topic-name" class="text-slate-500 text-sm mb-6"></p>
      
      <div class="glass-input rounded-2xl p-5 mb-8 flex justify-around">
        <div>
          <span class="text-[11px] uppercase tracking-wider text-slate-400 font-bold block mb-1">Правильно</span>
          <span id="score-correct" class="text-3xl font-black text-emerald-600">0</span>
        </div>
        <div class="border-r border-slate-300/60"></div>
        <div>
          <span class="text-[11px] uppercase tracking-wider text-slate-400 font-bold block mb-1">Всього</span>
          <span id="score-total" class="text-3xl font-black text-slate-700">0</span>
        </div>
      </div>

      <div class="space-y-3">
        <button id="retry-btn" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold py-3.5 rounded-2xl transition shadow-lg shadow-indigo-500/25">
          Спробувати ще раз
        </button>
        <button id="finish-btn" class="w-full glass-input hover:bg-white/80 text-slate-700 font-semibold py-3.5 rounded-2xl transition">
          До списку тем
        </button>
      </div>
    </div>
  </section>

  <script>
    const database = [
      {
        id: "finalsaetze",
        title: "Finalsätze (Damit & Um...zu)",
        category: "B1 / B2",
        theory: `
         <div class="space-y-3">
  <p class="font-medium text-slate-800"><b>Finalsätze</b> позначають мету, намір чи ціль дії (<i>Wozu? / Mit welcher Absicht?</i>):</p>
  
  <div class="p-3.5 bg-indigo-50/70 border border-indigo-100 rounded-xl space-y-1.5">
    <span class="font-bold text-indigo-900 block text-xs uppercase tracking-wider">1. um...zu + Infinitiv (Підмет однаковий)</span>
    <p>Використовується виключно тоді, коли виконавець дії в головній та підрядній частинах <b>один і той самий</b>:</p>
    <ul class="list-disc pl-4 text-xs space-y-1 text-slate-700">
      <li><b>Базова конструкція:</b> <i>Ich lerne Deutsch, <b>um</b> in Deutschland <b>zu studieren</b>.</i></li>
      <li><b>Відокремлювані префікси:</b> частка <i>zu</i> ставиться всередину → <i>auf<b>zu</b>stehen, ein<b>zu</b>halten, vor<b>zu</b>bereiten</i>.</li>
      <li><b>Невідокремлювані префікси та дієслова на -ieren:</b> <i>zu</i> пишеться окремо → <i><b>zu</b> bezahlen, <b>zu</b> optimieren</i>.</li>
      <li><b>З модальними дієсловами:</b> <i>...besser verstehen <b>zu können</b></i>.</li>
      <li><b>Passiv:</b> <i>...von allen richtig verstanden <b>zu werden</b></i>.</li>
    </ul>
  </div>

  <div class="p-3.5 bg-purple-50/70 border border-purple-100 rounded-xl space-y-1.5">
    <span class="font-bold text-purple-900 block text-xs uppercase tracking-wider">2. damit (Підмети різні або однакові)</span>
    <p>Повноцінне підрядне речення з власним підметом; відмінюване дієслово стоїть у <b>самому кінці</b>:</p>
    <p class="text-xs italic bg-white/80 p-2 rounded border border-purple-200">Ich gebe dir den Schlüssel, <b>damit du die Tür öffnest</b>.</p>
    <ul class="list-disc pl-4 text-xs space-y-1 text-slate-700">
      <li><b>З модальним дієсловом:</b> <i>...damit kleine Unternehmen die Krise überstehen <b>können</b>.</i></li>
      <li><b>Passiv:</b> <i>...damit künftige Sicherheitsrisiken minimiert <b>werden</b>.</i></li>
    </ul>
  </div>

  <div class="p-3 bg-amber-50/80 border border-amber-200 rounded-xl text-xs space-y-1 text-slate-700">
    <span class="font-bold text-amber-950 block">Головне правило вибору:</span>
    <p>• Якщо суб'єкти дій <b>різні</b> → обов'язково тільки <b>damit</b>.</p>
    <p>• Якщо суб'єкт <b>один</b> → стилістично перевага надається <b>um...zu</b>.</p>
  </div>
</div>
        `,
        questions: [
          {
            type: "choice",
            instruction: "Оберіть правильний сполучник:",
            q: "Ich lerne jeden Tag neue Wörter, ____ meinen Wortschatz zu erweitern.",
            options: ["damit", "um", "weil", "obwohl"],
            correct: "um",
            explanation: "Підмет однаковий (ich) + у кінці інфінітивна група з 'zu' (zu erweitern) -> використовуємо 'um...zu'."
          },
          {
            type: "choice",
            instruction: "Оберіть правильний сполучник:",
            q: "Die Eltern sparen viel Geld, ____ ihre Kinder an einer guten Universität studieren können.",
            options: ["damit", "um", "weil", "sodass"],
            correct: "damit",
            explanation: "Різні підмети (die Eltern / ihre Kinder) -> обов'язково вживається 'damit'."
          },
          {
            type: "choice",
            instruction: "Оберіть правильну форму з відокремлюваним префіксом:",
            q: "Er geht heute früher schlafen, um morgen fit ____.",
            options: ["aufzustehen", "aufstehen zu", "zu aufstehen", "aufgestanden"],
            correct: "aufzustehen",
            explanation: "У дієсловах із відокремлюваним префіксом частка 'zu' ставиться між префіксом і коренем: auf-zu-stehen."
          },
          {
            type: "choice",
            instruction: "Оберіть речення з правильним порядком слів:",
            q: "Який варіант граматично правильний?",
            options: [
              "Ich gebe dir den Schlüssel, damit du die Tür öffnen kannst.",
              "Ich gebe dir den Schlüssel, damit du kannst die Tür öffnen.",
              "Ich gebe dir den Schlüssel, damit kannst du die Tür öffnen.",
              "Ich gebe dir den Schlüssel, damit die Tür du öffnen kannst."
            ],
            correct: "Ich gebe dir den Schlüssel, damit du die Tür öffnen kannst.",
            explanation: "Після 'damit' дієслово (kannst) стоїть у самому кінці підрядного речення."
          },
          {
            type: "choice",
            instruction: "Оберіть правильну інфінітивну конструкцію з модальним дієсловом:",

            options: ["lesen zu können", "zu lesen können", "können zu lesen", "gelesen zu haben"],
            correct: "lesen zu können",
            explanation: "Схема з модальним дієсловом: основний інфінітив + zu + модальне дієслово в інфінітиві (lesen zu können)."
          },
          {
            type: "choice",
            instruction: "Оберіть зворотний займенник:",
            q: "Wir fahren ans Meer, um ____ nach dem stressigen Projekt zu erholen.",
            options: ["uns", "sich", "euch", "wir"],
            correct: "uns",
            explanation: "Підмет — wir, тому зворотний займенник для sich erholen має форму 'uns'."
          },
          {
            type: "choice",
            instruction: "Оберіть правильний варіант завершення:",
            q: "Der Lehrer spricht extra laut und deutlich, ____.",
            options: [
              "damit alle Schüler ihn verstehen",
              "um alle Schüler ihn verstehen",
              "damit alle Schüler ihn zu verstehen",
              "um alle Schüler ihn verstehen können"
            ],
            correct: "damit alle Schüler ihn verstehen",
            explanation: "Різні підмети (der Lehrer / alle Schüler), тому вживається 'damit' з відмінюваним дієсловом наприкінці."
          },
          {
            type: "choice",
            instruction: "Оберіть правильну форму:",
            q: "Ich habe den Wecker auf 6 Uhr gestellt, ____ den Bus nicht zu verpassen.",
            options: ["um", "damit", "weil", "ob"],
            correct: "um",
            explanation: "Підмет однаковий (ich) + конструкція з 'zu verpassen' -> 'um...zu'."
          },
          {
            type: "choice",
            instruction: "Оберіть правильний варіант:",
            q: "Er nimmt einen Regenschirm mit, um nicht nass ____.",
            options: ["zu werden", "werden zu", "geworden", "wird"],
            correct: "zu werden",
            explanation: "Інфінітивна група вимагає частку 'zu' перед інфінітивом дієслова (zu werden)."
          },
          {
            type: "choice",
            instruction: "Оберіть правильний сполучник:",
            q: "Schalte bitte das Radio leiser, ____ ich mich auf die Arbeit konzentrieren kann!",
            options: ["damit", "um", "denn", "weil"],
            correct: "damit",
            explanation: "Підмети різні (du — у наказовій формі / ich) -> вживаємо 'damit'."
          },
          {
            type: "choice",
            instruction: "Оберіть форму для невідокремлюваного префікса (bezahlen):",
            q: "Er arbeitet am Wochenende zusätzlich, um seine Schulden schneller ____.",
            options: ["zu bezahlen", "bezzuzahlen", "bezahlen zu", "bezahlt"],
            correct: "zu bezahlen",
            explanation: "Префікс 'be-' невідокремлюваний, тому частка 'zu' пишеться окремо перед усім дієсловом: 'zu bezahlen'."
          },
          {
            type: "choice",
            instruction: "Визначте, коли обов'язково потрібен сполучник 'damit':",
            q: "У якому випадку НЕ МОЖНА використати конструкцію 'um...zu'?",
            options: [
              "Коли в головному та підрядному реченнях різні підмети",
              "Коли в реченні є дієслово руху",
              "Коли речення стоїть у минулому часі",
              "Коли дієслово має відокремлюваний префікс"
            ],
            correct: "Коли в головному та підрядному реченнях різні підмети",
            explanation: "Конструкція 'um...zu' вживається лише за умови однакового підмета. Якщо підмети різні — тільки 'damit'."
          },
          {
            type: "choice",
            instruction: "Оберіть правильну пасивну інфінітивну конструкцію (B2):",
            q: "Er wiederholt die Argumente mehrfach, um von allen Anwesenden richtig ____.",
            options: [
              "verstanden zu werden",
              "zu verstehen werden",
              "verstanden werden zu",
              "verstehen worden zu"
            ],
            correct: "verstanden zu werden",
            explanation: "Passiv Infinitiv з часткою zu: Partizip II + zu + werden (verstanden zu werden)."
          },
          {
            type: "choice",
            instruction: "Оберіть дієслово на -ieren з часткою zu:",
            q: "Das Unternehmen investiert viel Geld, um die Produktionsprozesse vollständig ____.",
            options: [
              "zu automatisieren",
              "automatisierenzu",
              "automatisieren zu",
              "automatisierte"
            ],
            correct: "zu automatisieren",
            explanation: "У дієсловах на -ieren частка 'zu' пишеться окремо перед інфінітивом: 'zu automatisieren'."
          },
          {
            type: "choice",

            correct: "akzeptiert werden zu können",
            explanation: "Складна конструкція B2: Partizip II + werden + zu + können (akzeptiert werden zu können)."
          },

    type: "choice",
    instruction: "Оберіть правильний сполучник:",
    q: "Er besucht einen Vorbereitungskurs, ____ die C1-Prüfung beim ersten Versuch zu bestehen.",
    options: ["um", "damit", "obwohl", "sodass"],
    correct: "um",
    explanation: "Один суб'єкт дії (er) + інфінітивна конструкція з 'zu bestehen' -> вживаємо 'um'."
  },
  {

    instruction: "Оберіть правильний сполучник:",
    q: "Die Dozentin spricht langsam und deutlich, ____ auch die ausländischen Studierenden alles problemlos verstehen.",
    options: ["damit", "um", "weil", "denn"],
    correct: "damit",
    explanation: "Різні підмети (die Dozentin / die Studierenden) -> обов'язково використовується 'damit'."
  },
  {
    type: "choice",
    instruction: "Оберіть правильну форму дієслова з відокремлюваним префіксом:",
    q: "Sie schaltet das Smartphone stumm, um sich nicht vom Lernen ____.",
    options: ["ablenken zu lassen", "abzulenken lassen", "abzulassen lenken", "abgelenkt zu werden"],
    correct: "ablenken zu lassen",
    explanation: "Конструкція 'sich ablenken lassen' в інфінітиві з zu: основне дієслово + zu + lassen (ablenken zu lassen)."
  },
  {
    type: "choice",
    instruction: "Оберіть правильний порядок слів у підрядному реченні:",
    q: "Який варіант граматично бездоганний?",
    options: [
      "Wir installieren eine Alarmanlage, damit unser Haus vor Einbrechern geschützt ist.",

          <p>Непрямі запитання: загальні питання (так/ні) $\rightarrow$ сполучник <b>ob</b>, спеціальні запитання зберігають питальне слово. Дієслово стоїть у кінці.</p>
        `,
        questions: [
          {
            type: "choice",
            instruction: "Оберіть питальне слово для спеціального питання:",
            q: "Können Sie mir sagen, ____ der nächste Zug abfährt?",
            options: ["wann", "ob", "warum", "dass"],
            correct: "wann",
            explanation: "Непряме спеціальне питання про час зберігає 'wann'."
          },
          {
            type: "choice",
            instruction: "Оберіть сполучник для питання так/ні:",
            q: "Ich weiß nicht, ____ er morgen zur Party kommt.",
            options: ["ob", "dass", "wann", "weil"],
            correct: "ob",
            explanation: "Для непрямого питання так/ні використовується сполучник 'ob' (чи)."
          }
        ]
      }
    ];

    // Елементи DOM
    const mainView = document.getElementById('main-view');
    const quizView = document.getElementById('quiz-view');
    const resultView = document.getElementById('result-view');
    const topicsGrid = document.getElementById('topics-grid');
    const searchInput = document.getElementById('search-input');
    const quizTitle = document.getElementById('quiz-title');
    const taskInstruction = document.getElementById('task-instruction');
    const quizProgress = document.getElementById('quiz-progress');
    const progressBar = document.getElementById('progress-bar');
    const questionNav = document.getElementById('question-nav');
    const quizQuestion = document.getElementById('quiz-question');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBox = document.getElementById('quiz-feedback');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');
    const backBtn = document.getElementById('back-btn');
    const retryBtn = document.getElementById('retry-btn');
    const finishBtn = document.getElementById('finish-btn');

    // Модальне вікно теорії
    const theoryModal = document.getElementById('theory-modal');
    const modalTitle = document.getElementById('modal-theory-title');
    const modalContent = document.getElementById('modal-theory-content');
    const openTheoryBtn = document.getElementById('open-theory-btn');
    const closeTheoryBtn = document.getElementById('close-theory-btn');
    const modalStartBtn = document.getElementById('modal-start-btn');

    let currentTopic = null;
    let currentQuestionsList = [];
    let currentIdx = 0;
    let correctCount = 0;
    let selectedOption = null;
    let answersHistory = {};

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function renderTopics(filter = '') {
      topicsGrid.innerHTML = '';
      const filtered = database.filter(t => 
        t.title.toLowerCase().includes(filter.toLowerCase()) ||
        t.category.toLowerCase().includes(filter.toLowerCase())
      );

      filtered.forEach(topic => {
        const card = document.createElement('div');
        card.className = "glass-card glass-card-hover p-5 sm:p-6 rounded-[28px] transition-all duration-300 cursor-pointer flex flex-col justify-between min-h-[135px] group";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] font-bold tracking-wider text-indigo-500 uppercase">${topic.category}</span>
              <span class="text-[11px] font-medium text-slate-400">💡 Правило + Тест</span>
            </div>
            <h2 class="font-bold text-slate-800 text-[15px] leading-snug group-hover:text-indigo-600 transition-colors">${topic.title}</h2>
          </div>
          <div class="flex items-center text-xs font-semibold text-indigo-600 mt-4 opacity-75 group-hover:opacity-100 transition-opacity">
            Практикувати (${topic.questions.length}) →
          </div>
        `;
        card.onclick = () => startQuiz(topic);
        topicsGrid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => renderTopics(e.target.value));

    function startQuiz(topic) {
      currentTopic = topic;
      currentQuestionsList = shuffleArray(topic.questions);
      currentIdx = 0;
      correctCount = 0;
      answersHistory = {};

      mainView.classList.add('hidden');
      resultView.classList.add('hidden');
      quizView.classList.remove('hidden');
      loadQuestion();
    }

    function openTheory() {
      if (!currentTopic) return;
      modalTitle.innerText = currentTopic.title;
      modalContent.innerHTML = currentTopic.theory;
      theoryModal.classList.remove('hidden');
    }

    function closeTheory() {
      theoryModal.classList.add('hidden');
    }

    openTheoryBtn.onclick = openTheory;
    closeTheoryBtn.onclick = closeTheory;
    modalStartBtn.onclick = closeTheory;

    function renderQuestionNav() {
      questionNav.innerHTML = '';
      currentQuestionsList.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.innerText = idx + 1;
        
        let style = "w-8 h-8 rounded-xl text-xs font-bold transition flex items-center justify-center ";
        
        if (idx === currentIdx) {
          style += "bg-indigo-600 text-white shadow-md ring-2 ring-indigo-300 ";
        } else if (answersHistory[idx] === true) {
          style += "bg-emerald-100 text-emerald-800 border border-emerald-300 ";
        } else if (answersHistory[idx] === false) {
          style += "bg-rose-100 text-rose-800 border border-rose-300 ";
        } else {
          style += "bg-slate-100 hover:bg-slate-200 text-slate-600 ";
        }

        btn.className = style;
        btn.onclick = () => {
          currentIdx = idx;
          loadQuestion();
        };
        questionNav.appendChild(btn);
      });
    }

    function loadQuestion() {
      selectedOption = null;
      feedbackBox.classList.add('hidden');
      checkBtn.classList.remove('hidden');
      nextBtn.classList.add('hidden');

      renderQuestionNav();

      const q = currentQuestionsList[currentIdx];
      quizTitle.innerText = currentTopic.title;
      quizProgress.innerText = `${currentIdx + 1} / ${currentQuestionsList.length}`;
      progressBar.style.width = `${((currentIdx + 1) / currentQuestionsList.length) * 100}%`;
      taskInstruction.innerText = q.instruction || "Оберіть правильний варіант відповіді:";
      quizQuestion.innerText = q.q;

      optionsContainer.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-2xl glass-input hover:bg-white/90 font-medium text-sm transition-all flex items-center shadow-xs";
        btn.innerHTML = `<span class="w-6 h-6 rounded-lg bg-white border border-slate-200/80 mr-3.5 flex items-center justify-center text-xs font-bold text-slate-500 shadow-xs">${String.fromCharCode(65 + i)}</span><span class="text-slate-700">${opt}</span>`;
        btn.onclick = () => {
          document.querySelectorAll('#options-container button').forEach(b => {
            b.classList.remove('border-indigo-500', 'bg-white/95', 'ring-2', 'ring-indigo-500/20');
            b.querySelector('span:last-child').classList.remove('text-indigo-900', 'font-bold');
          });
          btn.classList.add('border-indigo-500', 'bg-white/95', 'ring-2', 'ring-indigo-500/20');
          btn.querySelector('span:last-child').classList.add('text-indigo-900', 'font-bold');
          selectedOption = opt;
        };
        optionsContainer.appendChild(btn);
      });
    }

    checkBtn.onclick = () => {
      if (selectedOption === null) {
        alert("Будь ласка, оберіть варіант відповіді перед перевіркою.");
        return;
      }

      const q = currentQuestionsList[currentIdx];
      const isCorrect = selectedOption === q.correct;
      
      if (answersHistory[currentIdx] === undefined && isCorrect) {
        correctCount++;
      }
      answersHistory[currentIdx] = isCorrect;
      renderQuestionNav();

      feedbackBox.classList.remove('hidden');
      if (isCorrect) {
        feedbackBox.className = "p-5 rounded-2xl mb-6 text-sm font-medium bg-emerald-50/90 text-emerald-950 border border-emerald-200 shadow-xs";
        feedbackBox.innerHTML = `
          <div class="font-bold text-emerald-800 mb-1">✅ Правильно!</div>
          <div>${q.explanation}</div>
        `;
      } else {
        feedbackBox.className = "p-5 rounded-2xl mb-6 text-sm font-medium bg-rose-50/90 text-rose-950 border border-rose-200 shadow-xs";
        feedbackBox.innerHTML = `
          <div class="font-bold text-rose-800 mb-1">❌ Неправильно</div>
          <div class="mb-1">Правильна відповідь: <b>${q.correct}</b></div>
          <div>${q.explanation}</div>
        `;
      }

      checkBtn.classList.add('hidden');
      nextBtn.classList.remove('hidden');
    };

    nextBtn.onclick = () => {
      if (currentIdx + 1 < currentQuestionsList.length) {
        currentIdx++;
        loadQuestion();
      } else {
        quizView.classList.add('hidden');
        resultView.classList.remove('hidden');
        document.getElementById('result-topic-name').innerText = currentTopic.title;
        document.getElementById('score-correct').innerText = correctCount;
        document.getElementById('score-total').innerText = currentQuestionsList.length;
      }
    };

    function exitToMain() {
      quizView.classList.add('hidden');
      resultView.classList.add('hidden');
      mainView.classList.remove('hidden');
      renderTopics(searchInput.value);
    }

    backBtn.onclick = exitToMain;
    finishBtn.onclick = exitToMain;
    retryBtn.onclick = () => startQuiz(currentTopic);

    renderTopics();
  </script>
</body>
</html>
