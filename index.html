<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammatik Trainer — B1 / B2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
    }
    .glass-card-hover:hover {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(255, 255, 255, 1);
      box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.12);
      transform: translateY(-2px);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body class="bg-[#f1f5f9] text-slate-900 min-h-screen relative overflow-x-hidden flex flex-col items-center py-10 px-4 sm:px-6">

  <!-- Декоративні фонові сфери -->
  <div class="fixed top-[-10%] left-[-5%] w-[450px] h-[450px] rounded-full bg-gradient-to-tr from-indigo-300/40 to-blue-200/40 blur-[100px] pointer-events-none -z-10"></div>
  <div class="fixed top-[40%] right-[-5%] w-[500px] h-[500px] rounded-full bg-gradient-to-bl from-purple-300/35 to-pink-200/35 blur-[120px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-[-10%] left-[20%] w-[550px] h-[550px] rounded-full bg-gradient-to-tr from-sky-200/40 to-teal-200/30 blur-[110px] pointer-events-none -z-10"></div>

  <!-- ГОЛОВНИЙ ЕКРАН ТЕМ -->
  <main id="main-view" class="max-w-5xl w-full">
    <header class="text-center mb-10">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 glass-card rounded-full text-indigo-700 text-xs font-semibold uppercase tracking-wider mb-3.5 shadow-sm">
        ✨ Deutsch B1 · B2
      </div>
      <h1 class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight mb-2.5">
        Grammatik <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-blue-600">Trainer</span>
      </h1>
      <p class="text-slate-500 font-medium text-sm sm:text-base">Конструктор речень, вписування форм, пошук помилок і тести</p>
      
      <!-- Пошуковий рядок -->
      <div class="mt-7 max-w-md mx-auto relative">
        <input type="text" id="search-input" placeholder="Швидкий пошук теми або правила..." 
          class="w-full glass-input rounded-2xl px-5 py-3.5 pl-12 text-sm shadow-sm outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all placeholder:text-slate-400 text-slate-800">
        <svg class="w-5 h-5 text-slate-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </header>

    <!-- Сітка карток -->
    <div id="topics-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5"></div>
  </main>

  <!-- ЕКРАН ТЕСТУВАННЯ -->
  <section id="quiz-view" class="max-w-xl w-full hidden">
    <div class="flex items-center justify-between mb-4">
      <button id="back-btn" class="text-slate-500 hover:text-slate-900 font-medium text-sm inline-flex items-center gap-1.5 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Всі теми
      </button>

      <button id="open-theory-btn" class="text-xs font-semibold text-indigo-700 bg-indigo-50/80 hover:bg-indigo-100 border border-indigo-200/60 px-3.5 py-1.5 rounded-full inline-flex items-center gap-1.5 transition shadow-xs">
        💡 Правило
      </button>
    </div>

    <div class="glass-card p-6 sm:p-9 rounded-[32px] relative">
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-2">
          <span id="quiz-title" class="text-[11px] font-bold text-indigo-700 bg-indigo-50/80 px-3 py-1 rounded-full uppercase tracking-wider"></span>
          <span id="task-type-badge" class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md uppercase tracking-wider"></span>
        </div>
        <span id="quiz-progress" class="text-xs text-slate-400 font-mono font-medium">1 / 1</span>
      </div>

      <div class="w-full bg-slate-200/60 h-1.5 rounded-full mb-6 overflow-hidden">
        <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-blue-500 h-full transition-all duration-300 rounded-full" style="width: 0%"></div>
      </div>

      <!-- Інструкція та текст завдання -->
      <div class="mb-6">
        <span id="task-instruction" class="text-xs font-semibold text-indigo-600 block mb-1"></span>
        <p id="quiz-question" class="text-lg sm:text-xl font-semibold leading-relaxed text-slate-800"></p>
      </div>

      <!-- Динамічний контейнер взаємодії -->
      <div id="dynamic-container" class="mb-6"></div>

      <!-- Зворотний зв'язок -->
      <div id="quiz-feedback" class="p-5 rounded-2xl mb-6 hidden text-sm font-medium leading-relaxed backdrop-blur-md"></div>

      <div class="flex gap-3">
        <button id="check-btn" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold py-4 px-4 rounded-2xl transition shadow-lg shadow-indigo-500/25 active:scale-[0.99]">
          Перевірити відповідь
        </button>
        <button id="next-btn" class="w-full bg-slate-900 hover:bg-black text-white font-semibold py-4 px-4 rounded-2xl transition shadow-lg shadow-slate-900/20 hidden active:scale-[0.99]">
          Наступне завдання →
        </button>
      </div>
    </div>
  </section>

  <!-- МОДАЛЬНЕ ВІКНО З ТЕОРІЄЮ -->
  <div id="theory-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card bg-white/95 max-w-lg w-full p-6 sm:p-8 rounded-[32px] shadow-2xl relative max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-start mb-4">
        <div>
          <span class="text-[11px] font-bold tracking-wider text-indigo-600 uppercase block">Коротке правило</span>
          <h3 id="modal-theory-title" class="text-xl font-bold text-slate-900"></h3>
        </div>
        <button id="close-theory-btn" class="text-slate-400 hover:text-slate-700 p-1 rounded-full transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div id="modal-theory-content" class="text-sm text-slate-600 leading-relaxed space-y-3"></div>

      <button id="modal-start-btn" class="mt-6 w-full bg-slate-900 hover:bg-black text-white font-semibold py-3 rounded-xl transition text-sm">
        Зрозуміло, до вправ
      </button>
    </div>
  </div>

  <!-- ЕКРАН РЕЗУЛЬТАТІВ -->
  <section id="result-view" class="max-w-md w-full text-center hidden">
    <div class="glass-card p-8 sm:p-10 rounded-[36px]">
      <div class="text-5xl mb-4">🎯</div>
      <h2 class="text-2xl font-extrabold text-slate-900 mb-1">Розділ завершено!</h2>
      <p id="result-topic-name" class="text-slate-500 text-sm mb-6"></p>
      
      <div class="glass-input rounded-2xl p-5 mb-8 flex justify-around">
        <div>
          <span class="text-[11px] uppercase tracking-wider text-slate-400 font-bold block mb-1">Правильно</span>
          <span id="score-correct" class="text-3xl font-black text-emerald-600">0</span>
        </div>
        <div class="border-r border-slate-300/60"></div>
        <div>
          <span class="text-[11px] uppercase tracking-wider text-slate-400 font-bold block mb-1">Всього</span>
          <span id="score-total" class="text-3xl font-black text-slate-700">0</span>
        </div>
      </div>

      <div class="space-y-3">
        <button id="retry-btn" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold py-3.5 rounded-2xl transition shadow-lg shadow-indigo-500/25">
          Спробувати ще раз
        </button>
        <button id="finish-btn" class="w-full glass-input hover:bg-white/80 text-slate-700 font-semibold py-3.5 rounded-2xl transition">
          До списку тем
        </button>
      </div>
    </div>
  </section>

  <script>
    const database = [
      {
        id: "finalsaetze",
        title: "Finalsätze (Damit & Um...zu)",
        category: "B1",
        theory: `
          <p><b>Finalsätze</b> позначають мету чи намір (<i>Wozu? / Mit welcher Absicht?</i>):</p>
          <ul class="list-disc pl-5 space-y-1.5">
            <li><b>um...zu + Infinitiv:</b> коли суб'єкт однаковий в обох частинах (<i>Ich lerne Deutsch, um in Deutschland zu studieren</i>).</li>
            <li><b>damit:</b> коли суб'єкти різні або однакові, дієслово йде в кінець (<i>Ich gebe dir Geld, damit du ein Buch kaufst</i>).</li>
          </ul>
        `,
        questions: [
  {
    type: "choice",
    instruction: "Оберіть правильний сполучник:",
    q: "Ich lerne jeden Tag neue Wörter, ____ meinen Wortschatz zu erweitern.",
    options: ["damit", "um", "weil", "obwohl"],
    correct: "um",
    explanation: "Підмет однаковий (ich) + у кінці інфінітивна група з 'zu' (zu erweitern) -> використовуємо 'um...zu'."
  },
  {
    type: "choice",
    instruction: "Оберіть правильний варіант:",
    q: "Die Eltern sparen viel Geld, ____ ihre Kinder an einer guten Universität studieren können.",
    options: ["damit", "um", "weil", "sodass"],
    correct: "damit",
    explanation: "Різні підмети (die Eltern / ihre Kinder) -> обов'язково вживається 'damit'."
  },
  {
    type: "choice",
    instruction: "Оберіть правильну форму з відокремлюваним префіксом:",
    q: "Er geht heute früher schlafen, um morgen fit ____.",
    options: ["aufzustehen", "aufstehen zu", "zu aufstehen", "aufgestanden"],
    correct: "aufzustehen",
    explanation: "У дієсловах із відокремлюваним префіксом частка 'zu' ставиться між префіксом і коренем: auf-zu-stehen."
  },
  {
    type: "choice",
    instruction: "Оберіть речення з правильним порядком слів:",
    q: "Який варіант граматично правильний?",
    options: [
      "Ich gebe dir den Schlüssel, damit du die Tür öffnen kannst.",
      "Ich gebe dir den Schlüssel, damit du kannst die Tür öffnen.",
      "Ich gebe dir den Schlüssel, damit kannst du die Tür öffnen.",
      "Ich gebe dir den Schlüssel, damit die Tür du öffnen kannst."
    ],
    correct: "Ich gebe dir den Schlüssel, damit du die Tür öffnen kannst.",
    explanation: "Після 'damit' дієслово (kannst) стоїть у самому кінці підрядного речення."
  },
  {
    type: "choice",
    instruction: "Оберіть правильну інфінітивну конструкцію з модальним дієсловом:",
    q: "Sie setzt ihre Brille auf, um den Text besser ____.",
    options: ["lesen zu können", "zu lesen können", "können zu lesen", "gelesen zu haben"],
    correct: "lesen zu können",
    explanation: "Схема з модальним дієсловом: основний інфінітив + zu + модальне дієслово в інфінітиві (lesen zu können)."
  },
  {
    type: "choice",
    instruction: "Оберіть зворотний займенник:",
    q: "Wir fahren ans Meer, um ____ nach dem stressigen Projekt zu erholen.",
    options: ["uns", "sich", "euch", "wir"],
    correct: "uns",
    explanation: "Підмет — wir, тому зворотний займенник для sich erholen має форму 'uns'."
  },
  {
    type: "choice",
    instruction: "Оберіть правильний варіант завершення:",
    q: "Der Lehrer spricht extra laut und deutlich, ____.",
    options: [
      "damit alle Schüler ihn verstehen",
      "um alle Schüler ihn verstehen",
      "damit alle Schüler ihn zu verstehen",
      "um alle Schüler ihn verstehen können"
    ],
    correct: "damit alle Schüler ihn verstehen",
    explanation: "Різні підмети (der Lehrer / alle Schüler), тому вживається 'damit' з відмінюваним дієсловом наприкінці."
  },
  {
    type: "choice",
    instruction: "Оберіть правильну форму:",
    q: "Ich habe den Wecker auf 6 Uhr gestellt, ____ den Bus nicht zu verpassen.",
    options: ["um", "damit", "weil", "ob"],
    correct: "um",
    explanation: "Підмет однаковий (ich) + конструкція з 'zu verpassen' -> 'um...zu'."
  },
  {
    type: "choice",
    instruction: "Оберіть правильний варіант:",
    q: "Er nimmt einen Regenschirm mit, um nicht nass ____.",
    options: ["zu werden", "werden zu", "geworden", "wird"],
    correct: "zu werden",
    explanation: "Інфінітивна група вимагає частку 'zu' перед інфінітивом дієслова (zu werden)."
  },
  {
    type: "choice",
    instruction: "Оберіть правильний сполучник:",
    q: "Schalte bitte das Radio leiser, ____ ich mich auf die Arbeit konzentrieren kann!",
    options: ["damit", "um", "denn", "weil"],
    correct: "damit",
    explanation: "Підмети різні (du — у наказовій формі / ich) -> вживаємо 'damit'."
  },
  {
    type: "choice",
    instruction: "Оберіть форму для невідокремлюваного префікса (bezahlen):",
    q: "Er arbeitet am Wochenende zusätzlich, um seine Schulden schneller ____.",
    options: ["zu bezahlen", "bezzuzahlen", "bezahlen zu", "bezahlt"],
    correct: "zu bezahlen",
    explanation: "Префікс 'be-' невідокремлюваний, тому частка 'zu' пишеться окремо перед усім дієсловом: 'zu bezahlen'."
  },
  {
    type: "choice",
    instruction: "Визначте, коли обов'язково потрібен сполучник 'damit':",
    q: "У якому випадку НЕ МОЖНА використати конструкцію 'um...zu'?",
    options: [
      "Коли в головному та підрядному реченнях різні підмети",
      "Коли в реченні є дієслово руху",
      "Коли речення стоїть у минулому часі",
      "Коли дієслово має відокремлюваний префікс"
    ],
    correct: "Коли в головному та підрядному реченнях різні підмети",
    explanation: "Конструкція 'um...zu' вживається лише за умови однакового підмета. Якщо підмети різні — тільки 'damit'."
  },
  {
    type: "choice",
    instruction: "Оберіть правильний порядок слів із запереченням:",
    q: "Sie fährt mit dem Taxi zum Bahnhof, um ____.",
    options: [
      "den Zug nicht zu verpassen",
      "nicht den Zug verpassen zu",
      "zu den Zug nicht verpassen",
      "den Zug zu nicht verpassen"
    ],
    correct: "den Zug nicht zu verpassen",
    explanation: "Частка 'zu' стоїть безпосередньо перед інфінітивом у самому кінці речення: '...nicht zu verpassen'."
  },
  {
    type: "choice",
    instruction: "Оберіть правильний сполучник:",
    q: "Ich ziehe mir eine warme Jacke an, ____ mich nicht zu erkälten.",
    options: ["um", "damit", "obwohl", "sodass"],
    correct: "um",
    explanation: "Підмет однаковий (ich) + зворотне дієслово в інфінітиві (mich ... zu erkälten) -> 'um'."
  },
  {
    type: "choice",
    instruction: "Оберіть граматично правильний варіант:",
    q: "Der Arzt verschreibt dem Patienten Medikamente, ____.",
    options: [
      "damit die Schmerzen schnell nachlassen",
      "um die Schmerzen schnell nachlassen",
      "damit die Schmerzen schnell nachzulassen",
      "um schnell nachlassen die Schmerzen"
    ],
    correct: "damit die Schmerzen schnell nachlassen",
    explanation: "Підмети різні (der Arzt / die Schmerzen), тому вживається 'damit' з відмінюваним дієсловом (nachlassen) на кінці."
  },
  {
    type: "choice",
    instruction: "Оберіть правильну пасивну інфінітивну конструкцію (Passiv у Finalsatz):",
    q: "Er wiederholt die Argumente mehrfach, um von allen Anwesenden richtig ____.",
    options: [
      "verstanden zu werden",
      "zu verstehen werden",
      "verstanden werden zu",
      "verstehen worden zu"
    ],
    correct: "verstanden zu werden",
    explanation: "Passiv Infinitiv з часткою zu: Partizip II + zu + werden (verstanden zu werden)."
  },
  {
    type: "choice",
    instruction: "Оберіть дієслово на -ieren з часткою zu:",
    q: "Das Unternehmen investiert viel Geld, um die Produktionsprozesse vollständig ____.",
    options: [
      "zu automatisieren",
      "automatisierenzu",
      "automatisieren zu",
      "automatisierte"
    ],
    correct: "zu automatisieren",
    explanation: "У дієсловах на -ieren частка 'zu' пишеться окремо перед інфінітивом: 'zu automatisieren'."
  },
  {
    type: "choice",
    instruction: "Оберіть граматично коректний варіант для академічного контексту:",
    q: "Der Forscher führt zusätzliche Experimente durch, ____ die Hypothese eindeutig belegen zu können.",
    options: ["um", "damit", "obwohl", "insofern"],
    correct: "um",
    explanation: "Суб'єкт один (der Forscher) + інфінітивна конструкція з 'belegen zu können' -> вживаємо 'um'."
  },
  {
    type: "choice",
    instruction: "Оберіть правильну конструкцію з модальним дієсловом:",
    q: "Die Regierung senkt die Steuern, ____ kleine Unternehmen die Krise besser überstehen können.",
    options: ["damit", "um", "weil", "sodass"],
    correct: "damit",
    explanation: "Суб'єкти різні (die Regierung / kleine Unternehmen), тому необхідний сполучник 'damit' з дієсловом у кінці."
  },
  {
    type: "choice",
    instruction: "Оберіть правильну форму зворотного дієслова:",
    q: "Sie nimmt sich eine Auszeit, um ____ ganz auf ihre Doktorarbeit zu konzentrieren.",
    options: ["sich", "ihr", "sie", "ihnen"],
    correct: "sich",
    explanation: "Підмет 'sie' (вона) вимагає зворотного займенника 'sich': sich auf etwas konzentrieren."
  },
  {
    type: "choice",
    instruction: "Оберіть форму для дієслова зі складним відокремлюваним префіксом:",
    q: "Wir treffen uns heute früher, um die Dokumente gemeinsam ____.",
    options: [
      "durchzugehen",
      "zu durchgehen",
      "durchgehen zu",
      "durchgegangen"
    ],
    correct: "durchzugehen",
    explanation: "У відокремлюваному дієслові durchgehen частка 'zu' ставиться між префіксом і коренем: durch-zu-gehen."
  },
  {
    type: "choice",
    instruction: "Оберіть варіант зі збереженням нормативного порядку слів B2:",
    q: "Er spart monatlich einen festen Betrag, ____.",
    options: [
      "um sich im Alter finanziell absichern zu können",
      "um sich im Alter finanziell zu absichern können",
      "um kann sich im Alter finanziell absichern",
      "damit im Alter sich finanziell absichern zu können"
    ],
    correct: "um sich im Alter finanziell absichern zu können",
    explanation: "Нормативна інфінітивна група з модальним дієсловом: Infinitiv + zu + Modalverb (absichern zu können)."
  },
  {
    type: "choice",
    instruction: "Оберіть правильний сполучник у складному реченні:",
    q: "Die Richtlinien wurden verschärft, ____ künftige Sicherheitsrisiken minimiert werden.",
    options: ["damit", "um", "denn", "falls"],
    correct: "damit",
    explanation: "У підрядному реченні є власний граматичний підмет (Sicherheitsrisiken) та відмінюване дієслово (werden), тому потрібен сполучник 'damit'."

    function renderTopics(filter = '') {
      topicsGrid.innerHTML = '';

        t.title.toLowerCase().includes(filter.toLowerCase()) ||
        t.category.toLowerCase().includes(filter.toLowerCase())
      );

      filtered.forEach(topic => {
        const card = document.createElement('div');
        card.className = "glass-card glass-card-hover p-5 sm:p-6 rounded-[28px] transition-all duration-300 cursor-pointer flex flex-col justify-between min-h-[135px] group";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] font-bold tracking-wider text-indigo-500 uppercase">${topic.category}</span>
              <span class="text-[11px] font-medium text-slate-400">💡 Правило + Тест</span>
            </div>
            <h2 class="font-bold text-slate-800 text-[15px] leading-snug group-hover:text-indigo-600 transition-colors">${topic.title}</h2>

          <div class="flex items-center text-xs font-semibold text-indigo-600 mt-4 opacity-75 group-hover:opacity-100 transition-opacity">
            Практикувати →
          </div>
        `;
        card.onclick = () => startQuiz(topic);
        topicsGrid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => renderTopics(e.target.value));

    function startQuiz(topic) {
      currentTopic = topic;
      currentIdx = 0;
      correctCount = 0;
      mainView.classList.add('hidden');
      resultView.classList.add('hidden');
      quizView.classList.remove('hidden');
      loadQuestion();
    }

    function openTheory() {
      if (!currentTopic) return;
      modalTitle.innerText = currentTopic.title;
      modalContent.innerHTML = currentTopic.theory;
      theoryModal.classList.remove('hidden');
    }

    function closeTheory() {
      theoryModal.classList.add('hidden');
    }

    openTheoryBtn.onclick = openTheory;
    closeTheoryBtn.onclick = closeTheory;
    modalStartBtn.onclick = closeTheory;

    // Рендер завдання відповідно до типу
    function loadQuestion() {
      feedbackBox.classList.add('hidden');
      checkBtn.classList.remove('hidden');
      nextBtn.classList.add('hidden');

      const q = currentTopic.questions[currentIdx];
      quizTitle.innerText = currentTopic.title;
      quizProgress.innerText = `${currentIdx + 1} / ${currentTopic.questions.length}`;
      progressBar.style.width = `${((currentIdx + 1) / currentTopic.questions.length) * 100}%`;
      taskInstruction.innerText = q.instruction || "Виконайте завдання:";
      quizQuestion.innerText = q.q;

      dynamicContainer.innerHTML = '';

      // ТИП 1: Multiple Choice
      if (q.type === 'choice') {
        taskTypeBadge.innerText = "Вибір";
        userSelectedChoice = null;
        const optionsWrapper = document.createElement('div');
        optionsWrapper.className = "space-y-3";

        q.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = "w-full text-left p-4 rounded-2xl glass-input hover:bg-white/90 font-medium text-sm transition-all flex items-center shadow-xs";
          btn.innerHTML = `<span class="w-6 h-6 rounded-lg bg-white border border-slate-200/80 mr-3.5 flex items-center justify-center text-xs font-bold text-slate-500 shadow-xs">${String.fromCharCode(65 + i)}</span><span class="text-slate-700">${opt}</span>`;
          btn.onclick = () => {
            optionsWrapper.querySelectorAll('button').forEach(b => {
              b.classList.remove('border-indigo-500', 'bg-white/95', 'ring-2', 'ring-indigo-500/20');
              b.querySelector('span:last-child').classList.remove('text-indigo-900', 'font-bold');
            });
            btn.classList.add('border-indigo-500', 'bg-white/95', 'ring-2', 'ring-indigo-500/20');
            btn.querySelector('span:last-child').classList.add('text-indigo-900', 'font-bold');
            userSelectedChoice = opt;
          };
          optionsWrapper.appendChild(btn);
        });
        dynamicContainer.appendChild(optionsWrapper);
      }

      // ТИП 2: Вписування форми (Fill in the blank) з клавіатурою умлаутів
      else if (q.type === 'input') {
        taskTypeBadge.innerText = "Вписування";
        const inputWrapper = document.createElement('div');
        inputWrapper.className = "space-y-3";

        const textInput = document.createElement('input');
        textInput.type = "text";
        textInput.id = "blank-input";
        textInput.placeholder = "Введіть правильну відповідь...";
        textInput.className = "w-full glass-input rounded-2xl px-5 py-3.5 text-base shadow-sm outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium text-slate-800";
        inputWrapper.appendChild(textInput);

        // Панель умлаутів
        const umlautBar = document.createElement('div');
        umlautBar.className = "flex flex-wrap gap-1.5 pt-1";
        ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'].forEach(char => {
          const uBtn = document.createElement('button');
          uBtn.type = "button";
          uBtn.className = "px-3 py-1.5 bg-white/80 hover:bg-white border border-slate-200/80 rounded-xl text-sm font-bold text-slate-700 shadow-xs hover:border-indigo-300 transition active:scale-95";
          uBtn.innerText = char;
          uBtn.onclick = () => {
            textInput.value += char;
            textInput.focus();
          };
          umlautBar.appendChild(uBtn);
        });
        inputWrapper.appendChild(umlautBar);
        dynamicContainer.appendChild(inputWrapper);
        setTimeout(() => textInput.focus(), 50);
      }

      // ТИП 3: Конструктор речень (Word Order)
      else if (q.type === 'order') {
        taskTypeBadge.innerText = "Порядок слів";
        userOrderSentence = [];
        userAvailableWords = [...q.words];

        const orderWrapper = document.createElement('div');
        orderWrapper.className = "space-y-4";

        // Поле складеного речення
        const resultZone = document.createElement('div');
        resultZone.id = "order-result-zone";
        resultZone.className = "min-h-[64px] p-3.5 rounded-2xl glass-input border-dashed border-2 border-indigo-200 flex flex-wrap gap-2 items-center";
        
        // Зона доступних слів
        const sourceZone = document.createElement('div');
        sourceZone.id = "order-source-zone";
        sourceZone.className = "flex flex-wrap gap-2 pt-2";

        orderWrapper.appendChild(resultZone);
        orderWrapper.appendChild(sourceZone);
        dynamicContainer.appendChild(orderWrapper);

        renderWordOrderZones();
      }

      // ТИП 4: Пошук помилки (Find Error)
      else if (q.type === 'find_error') {
        taskTypeBadge.innerText = "Пошук помилки";
        userSelectedErrorIndex = null;

        const errorWrapper = document.createElement('div');
        errorWrapper.className = "flex flex-wrap gap-2.5 p-4 rounded-2xl glass-input";

        q.sentence.forEach((word, idx) => {
          const wordBtn = document.createElement('button');
          wordBtn.className = "px-3 py-2 bg-white/90 hover:bg-indigo-50 border border-slate-200/80 rounded-xl text-base font-semibold text-slate-800 shadow-xs transition active:scale-95";
          wordBtn.innerText = word;
          wordBtn.onclick = () => {
            errorWrapper.querySelectorAll('button').forEach(b => b.classList.remove('ring-2', 'ring-rose-500', 'bg-rose-50', 'text-rose-900', 'border-rose-300'));
            wordBtn.classList.add('ring-2', 'ring-rose-500', 'bg-rose-50', 'text-rose-900', 'border-rose-300');
            userSelectedErrorIndex = idx;
          };
          errorWrapper.appendChild(wordBtn);
        });

        dynamicContainer.appendChild(errorWrapper);
      }
    }

    // Допоміжна функція рендеру для Word Order
    function renderWordOrderZones() {
      const resultZone = document.getElementById('order-result-zone');
      const sourceZone = document.getElementById('order-source-zone');
      if (!resultZone || !sourceZone) return;

      resultZone.innerHTML = '';
      sourceZone.innerHTML = '';

      if (userOrderSentence.length === 0) {
        resultZone.innerHTML = '<span class="text-xs text-slate-400 font-medium italic">Клікайте на слова нижче, щоб побудувати речення...</span>';
      } else {
        userOrderSentence.forEach((word, idx) => {
          const tile = document.createElement('button');
          tile.className = "px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-sm font-semibold shadow-xs hover:bg-indigo-700 transition active:scale-95";
          tile.innerText = word;
          tile.onclick = () => {
            userOrderSentence.splice(idx, 1);
            userAvailableWords.push(word);
            renderWordOrderZones();
          };
          resultZone.appendChild(tile);
        });
      }

      userAvailableWords.forEach((word, idx) => {
        const tile = document.createElement('button');
        tile.className = "px-3 py-1.5 bg-white border border-slate-200/90 text-slate-800 rounded-xl text-sm font-semibold shadow-xs hover:bg-slate-50 transition active:scale-95";
        tile.innerText = word;
        tile.onclick = () => {
          userAvailableWords.splice(idx, 1);
          userOrderSentence.push(word);
          renderWordOrderZones();
        };
        sourceZone.appendChild(tile);
      });
    }

    // Перевірка відповіді для всіх типів завдань
    checkBtn.onclick = () => {
      const q = currentTopic.questions[currentIdx];
      let isCorrect = false;
      let userProvidedAnswer = "";

      if (q.type === 'choice') {
        if (userSelectedChoice === null) {
          alert("Будь ласка, оберіть варіант відповіді.");
          return;
        }
        isCorrect = userSelectedChoice === q.correct;
      } 
      else if (q.type === 'input') {
        const inputVal = document.getElementById('blank-input').value.trim();
        if (!inputVal) {
          alert("Введіть відповідь у поле перед перевіркою.");
          return;
        }
        userProvidedAnswer = inputVal;
        const normalized = inputVal.toLowerCase().replace(/^-/, '');
        isCorrect = q.correct.some(ans => ans.toLowerCase().replace(/^-/, '') === normalized);
      }
      else if (q.type === 'order') {
        if (userOrderSentence.length !== q.correct.length) {
          alert("Використайте всі слова для побудови речення.");
          return;
        }
        isCorrect = userOrderSentence.join(' ') === q.correct.join(' ');
      }
      else if (q.type === 'find_error') {
        if (userSelectedErrorIndex === null) {
          alert("Натисніть на слово, у якому ви бачите помилку.");
          return;
        }
        isCorrect = userSelectedErrorIndex === q.errorWordIndex;
      }

      if (isCorrect) correctCount++;

      feedbackBox.classList.remove('hidden');
      if (isCorrect) {
        feedbackBox.className = "p-5 rounded-2xl mb-6 text-sm font-medium bg-emerald-50/90 text-emerald-950 border border-emerald-200 shadow-xs";
        feedbackBox.innerHTML = `
          <div class="font-bold text-emerald-800 mb-1">✅ Чудово! Правильно.</div>
          <div>${q.explanation}</div>
        `;
      } else {
        feedbackBox.className = "p-5 rounded-2xl mb-6 text-sm font-medium bg-rose-50/90 text-rose-950 border border-rose-200 shadow-xs";
        
        let correctDisplay = "";
        if (q.type === 'choice' || q.type === 'input') {
          correctDisplay = `Правильна відповідь: <b>${Array.isArray(q.correct) ? q.correct[0] : q.correct}</b>.`;
        } else if (q.type === 'order') {
          correctDisplay = `Правильний порядок: <b>${q.correct.join(' ')}</b>.`;
        } else if (q.type === 'find_error') {
          correctDisplay = `Помилка в слові «<b>${q.sentence[q.errorWordIndex]}</b>». Правильно: <b>${q.correction}</b>.`;
        }

        feedbackBox.innerHTML = `
          <div class="font-bold text-rose-800 mb-1">❌ Помилка</div>
          <div class="mb-1">${correctDisplay}</div>
          <div>${q.explanation}</div>
        `;
      }

      checkBtn.classList.add('hidden');
      nextBtn.classList.remove('hidden');
    };

    nextBtn.onclick = () => {
      if (currentIdx + 1 < currentTopic.questions.length) {
        currentIdx++;
        loadQuestion();
      } else {
        quizView.classList.add('hidden');
        resultView.classList.remove('hidden');
        document.getElementById('result-topic-name').innerText = currentTopic.title;
        document.getElementById('score-correct').innerText = correctCount;
        document.getElementById('score-total').innerText = currentTopic.questions.length;
      }
    };

    function exitToMain() {
      quizView.classList.add('hidden');
      resultView.classList.add('hidden');
      mainView.classList.remove('hidden');
      renderTopics(searchInput.value);
    }

    backBtn.onclick = exitToMain;
    finishBtn.onclick = exitToMain;
    retryBtn.onclick = () => startQuiz(currentTopic);

    renderTopics();
  </script>
</body>
</html>
